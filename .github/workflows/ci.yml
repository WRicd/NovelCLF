name: NovelCLF CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linter
        run: pip install ruff

      - name: Run ruff
        run: ruff check src/ scripts/ api.py app.py

  test:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Compile check — src modules
        run: |
          python -m py_compile src/config.py
          python -m py_compile src/features.py
          python -m py_compile src/train.py
          python -m py_compile src/predict.py
          python -m py_compile src/evaluate.py
          python -m py_compile src/explain.py
          python -m py_compile src/preprocess.py
          python -m py_compile src/persistence.py
          python -m py_compile src/experiment.py

      - name: Compile check — scripts & entrypoints
        run: |
          python -m py_compile scripts/train_model.py
          python -m py_compile scripts/build_dataset.py
          python -m py_compile scripts/predict_text.py
          python -m py_compile scripts/cross_validate.py
          python -m py_compile scripts/run_experiment.py
          python -m py_compile scripts/show_experiments.py
          python -m py_compile api.py
          python -m py_compile app.py

      - name: Import smoke test
        run: |
          python -c "from src.config import SUPPORTED_MODELS, SUPPORTED_SPLITS; print('Models:', sorted(SUPPORTED_MODELS)); print('Splits:', sorted(SUPPORTED_SPLITS))"
